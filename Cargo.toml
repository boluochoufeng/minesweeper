[package]
name = "minesweeper"
version = "50.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A Bevy recreation of GNOME Mines"

[dependencies]
bevy = { version = "0.19.0", features = ["bevy_feathers", "bevy_settings"] }
dirs = "6.0"
rand = "0.9"
resvg = { version = "0.45", default-features = false, features = ["system-fonts", "text"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
winit = { version = "0.30.13", default-features = false }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
